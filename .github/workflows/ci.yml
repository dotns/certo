name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: '1.99.1'
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny,cargo-shear,cargo-hack
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked
      - run: cargo nextest run --workspace --all-features --locked --profile ci
      - run: cargo test --doc --workspace --all-features --locked
      - run: cargo deny check
      - run: cargo shear
      - uses: crate-ci/typos@v1.51.1

  rust-msrv:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: '1.88'
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - run: cargo hack check --rust-version --workspace --all-targets --locked

  e2e:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: '1.99.1'
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: oven-sh/setup-bun@v2
      - name: Install dig and ldns
        run: sudo apt-get update && sudo apt-get install -y dnsutils ldnsutils
      - name: Build the dashboard
        run: cd web && npm ci && npx vite build
      - name: Build certo
        run: cargo build --locked -p certo
      - name: e2e
        env:
          CERTO_BIN: ${{ github.workspace }}/target/debug/certo
        run: cd tests/e2e && bun test
