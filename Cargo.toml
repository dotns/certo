[workspace]
resolver        = "3"
members         = ["crates/*"]
default-members = ["crates/certo"]

[workspace.package]
version      = "0.0.1"
edition      = "2024"
rust-version = "1.88"
license      = "Apache-2.0"
repository   = "https://github.com/dotns/certo"
description  = "Authoritative DNS server with ACME DNS-01 challenge support"
keywords     = ["dns", "acme", "dnssec"]
categories   = ["network-programming"]
readme       = "README.md"

[workspace.dependencies]
certo-core = { path = "crates/certo-core" }
certo-db   = { path = "crates/certo-db" }
certo-api  = { path = "crates/certo-api" }
certo-pdns = { path = "crates/certo-pdns" }

anyhow         = "1.0.104"
async-trait    = "0.1.92"
aws-lc-rs      = "1.18.2"
axum           = "0.8.9"
axum-server    = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
base64         = "0.23.1"
bcrypt         = "0.19.3"
clap           = { version = "4.6.7", features = ["derive"] }
figment        = { version = "0.10.19", features = ["toml", "env"] }
hickory-resolver = "0.26.3"
http-body-util = "0.1.3"
hyper-util     = { version = "0.1.21", features = ["tokio"] }
instant-acme   = { version = "0.8.5", features = ["rcgen"] }
ipnet          = "2.12.2"
jsonwebtoken   = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
mime_guess     = "2.0.5"
reqwest        = { version = "0.13.5", default-features = false, features = ["json"] }
rlimit         = "0.11.0"
rust-embed     = "8.13.0"
rusqlite       = { version = "0.40.2", features = ["bundled"] }
serde_json     = "1.0.154"
rustc-hash     = "2.1.3"
rustix         = { version = "1.1.5", features = ["fs", "process"] }
rustls         = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
secrecy        = "0.10.3"
serde          = { version = "1.0.229", features = ["derive"] }
subtle         = "2.6.1"
tempfile       = "3.27.0"
thiserror      = "2.0.21"
time           = "0.3.55"
tower          = { version = "0.5.3", features = ["util"] }
tokio          = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal", "process", "io-util"] }
tracing        = "0.1.44"
x509-parser    = "0.18.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt"] }

[workspace.lints.rust]
warnings                      = { level = "deny", priority = -2 }
unsafe_code                   = "forbid"
missing_debug_implementations = "warn"
missing_docs                  = "warn"
unreachable_pub               = "warn"
elided_lifetimes_in_paths     = "warn"

[workspace.lints.clippy]
pedantic                = { level = "warn", priority = -1 }
nursery                 = { level = "warn", priority = -1 }
cargo                   = { level = "warn", priority = -1 }
unwrap_used             = "deny"
expect_used             = "deny"
panic                   = "deny"
todo                    = "warn"
dbg_macro               = "deny"
print_stdout            = "deny"
print_stderr            = "deny"
disallowed_methods      = "deny"
disallowed_types        = "deny"
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
multiple_crate_versions = "allow"
redundant_pub_crate     = "allow"

[profile.release]
lto           = "fat"
codegen-units = 1
debug         = "line-tables-only"

[profile.dist]
inherits  = "release"
strip     = "symbols"
panic     = "abort"
debug     = false

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
