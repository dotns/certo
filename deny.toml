[graph]
all-features = true

[advisories]
yanked = "warn"
ignore = []

[licenses]
version = 2
allow = [
    "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "MIT-0",
    "BSD-2-Clause", "BSD-3-Clause", "BSL-1.0", "0BSD",
    "ISC", "Unicode-3.0", "CC0-1.0", "CDLA-Permissive-2.0", "Zlib",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
deny = [
    { name = "openssl",        reason = "use rustls" },
    { name = "openssl-sys",    reason = "use rustls" },
    { name = "native-tls",     reason = "use rustls" },
    { name = "native-tls-sys", reason = "use rustls" },
    { name = "dotenv",         reason = "unmaintained, use dotenvy" },
]

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-git        = []
